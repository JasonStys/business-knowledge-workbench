# Local demo only. Production requires HTTPS, secure cookies and non-demo accounts.
services:
  workbench:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      KB_DEMO: "1"
      KB_ORIGIN: "http://127.0.0.1:8000"
    volumes: ["workbench-data:/app/data"]
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 80
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  workbench-data:
