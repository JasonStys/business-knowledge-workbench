name: Release private-account applications
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact validated source commit
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: business-knowledge-workbench-release-v1.4.1
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      security-events: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      release_id: ${{ steps.gate.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.10"
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py prepare
  build:
    needs: prepare
    strategy:
      fail-fast: false
      # Serial uploads avoid observing another platform's unfinished/starter assets.
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Isolate Python from preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: pip check
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: python scripts/license_bundle.py
      - run: python -m PyInstaller --noconfirm --onefile --name business-knowledge-workbench-service --distpath release/service --paths . --collect-all docx --add-data "server/schema.sql:server" --add-data "dist:ui" scripts/frozen_entry.py
      - run: npm run package -- --publish never
      - name: Verify actual packaged app and create checksummed archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export KBW_INSTALLED_APP="$PWD/release/installers/win-unpacked/Business Knowledge Workbench.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            export KBW_INSTALLED_APP="$PWD/release/installers/mac-arm64/Business Knowledge Workbench.app/Contents/MacOS/Business Knowledge Workbench"
          else
            export KBW_INSTALLED_APP="$PWD/release/installers/linux-unpacked/business-knowledge-workbench"
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop; else npm run test:desktop; fi
          python scripts/release_archive.py
      - name: Upload only tested binaries to draft Release, not Actions storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_guard.py upload
  verify-draft:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub requires push visibility for unpublished drafts, even for a GET-only verifier.
      # https://docs.github.com/en/rest/releases/releases#get-a-release
      contents: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.10"
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        # GET-only: leave draft for independent downloaded application/installer acceptance.
        run: python scripts/release_guard.py verify
