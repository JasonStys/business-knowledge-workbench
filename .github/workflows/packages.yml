name: Desktop packages
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - "web/**"
      - "desktop/**"
      - "runner/**"
      - "training/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
      - "docs/licenses/**"
      - "package*.json"
      - "pyproject.toml"
      - "requirements.lock"
      - "*config*"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Isolate Python from preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: python -m pip check
      - run: npm ci
      - run: npm run build
      - run: python scripts/license_bundle.py
      - run: python -m PyInstaller --noconfirm --onefile --name business-knowledge-workbench-service --distpath release/service --paths . --collect-all docx --add-data "server/schema.sql:server" --add-data "dist:ui" scripts/frozen_entry.py
      - run: npm run test:desktop
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run package -- --publish never
      - name: Verify the actual packaged executable
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export KBW_INSTALLED_APP="$PWD/release/installers/win-unpacked/Business Knowledge Workbench.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
            export KBW_INSTALLED_APP="$PWD/release/installers/mac-arm64/Business Knowledge Workbench.app/Contents/MacOS/Business Knowledge Workbench"
          else
            export KBW_INSTALLED_APP="$PWD/release/installers/linux-unpacked/business-knowledge-workbench"
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop; else npm run test:desktop; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && vars.KBW_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/installers/*.exe
            release/installers/*.AppImage
            release/installers/*.dmg
            test-results/
