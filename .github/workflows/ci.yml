# Automated correctness, portability and dependency gates. Evidence is retained on failure.
name: Validate workbench
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -e .
      - run: python -m ruff check server scripts tests/python
      - run: python -m ruff format --check server scripts tests/python
      - run: python -m pytest -q
      - run: python scripts/benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: docs/reports/*.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock -e .
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: python scripts/code_index.py --check
      - run: python scripts/file_catalog.py --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m pip_audit -r requirements.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/reports/browser-results.json
            playwright-report
            test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/api/health
      - run: curl --fail http://127.0.0.1:8000/manifest.webmanifest
      - run: docker compose logs
        if: always()
      - run: docker compose down
        if: always()
